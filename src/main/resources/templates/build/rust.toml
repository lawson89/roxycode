[commands]
install = "cargo fetch"
clean = "cargo clean"
compile = "cargo check --tests"
build = "cargo build"
test_all = "cargo test"
test_single = "cargo test {testName}"
lint = "cargo clippy -- -D warnings"
lint_single = "cargo clippy -- -D warnings"
format = "cargo fmt"
format_single = "rustfmt {file}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^error(\[E\d+\])?:'
test_failure_regex = '^test .* FAILED$'

[container]
enabled = false
image = "rust:1.85"
workdir = "/workspace"
