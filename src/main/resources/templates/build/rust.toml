timeout_seconds = 600

[commands]
install = "cargo fetch"
clean = "cargo clean"
compile = "cargo check --tests"
build = "cargo build"
test_all = "cargo test"
test_single = "cargo test {testName}"
lint = "cargo clippy -- -D warnings"
format = "cargo fmt"

[env]
ROXY_CODE = "true"
# Optional: Set Rust / Cargo environment variables if needed:
# RUST_BACKTRACE = "1"
# CARGO_TERM_COLOR = "never"

[parse]
error_regex = '^error(\[E\d+\])?:'
test_failure_regex = '^test .* FAILED$'
context_lines = 5

[sandbox]
# Isolation mode: "none" | "native" (Linux bwrap / macOS sandbox-exec) | "docker"
mode = "none"
# Additional host paths mounted read-only in "native" mode (e.g., rustup toolchains; supports ~/ expansion)
readable_paths = ["~/.rustup", "~/.cargo/bin"]
# Additional host paths mounted read-write in "native" mode (e.g., Cargo registry & git cache; supports ~/ expansion)
writable_paths = ["~/.cargo"]
# Docker settings (used when mode = "docker")
image = "rust:1.85"
workdir = "/workspace"
