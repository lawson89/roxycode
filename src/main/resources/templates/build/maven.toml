[commands]
install = "./mvnw dependency:resolve"
clean = "./mvnw clean"
compile = "./mvnw test-compile"
build = "./mvnw package -DskipTests"
test_all = "./mvnw test"
test_single = "./mvnw test -Dtest={testName}"
lint = "./mvnw pmd:check spotless:check"
lint_single = "./mvnw pmd:check spotless:check -DspotlessFiles=.*\\Q{file}\\E$"
format = "./mvnw spotless:apply"
format_single = "./mvnw spotless:apply -DspotlessFiles=.*\\Q{file}\\E$"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '\[ERROR\].*\[\d+,\d+\]|PMD Failure:'
test_failure_regex = '\[ERROR\]\s+[\w.#]+:\d+.*|<<< FAILURE!|<<< ERROR!'

[container]
enabled = false
image = "eclipse-temurin:25-jdk"
workdir = "/workspace"
