[build]
compile = "./mvnw compile"
clean = "./mvnw clean"

[test]
run_all = "./mvnw test"
run_single = "./mvnw test -Dtest={testName}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '\[ERROR\].*\[\d+,\d+\]|PMD Failure:'
test_failure_regex = '\[ERROR\]\s+[\w.#]+:\d+.*|<<< FAILURE!|<<< ERROR!'

[container]
enabled = false
image = "eclipse-temurin:25-jdk"
workdir = "/workspace"
