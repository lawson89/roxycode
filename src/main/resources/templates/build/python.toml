[commands]
install = "pip install -r requirements.txt"
clean = "find . -type d -name __pycache__ -exec rm -rf {} +"
compile = ""
build = ""
test_all = "pytest"
test_single = "pytest -k {testName}"
lint = "ruff check ."
lint_single = "ruff check {file}"
format = "ruff format ."
format_single = "ruff format {file}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^(E\s+|SyntaxError:|IndentationError:)'
test_failure_regex = '^FAILED '

[container]
enabled = false
image = "python:3.12"
workdir = "/workspace"
