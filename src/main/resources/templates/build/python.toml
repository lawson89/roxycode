[build]
compile = "python3 -m py_compile **/*.py"
clean = "find . -type d -name __pycache__ -exec rm -rf {} +"

[test]
run_all = "pytest"
run_single = "pytest -k {testName}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^(E\s+|SyntaxError:|IndentationError:)'
test_failure_regex = '^FAILED '

[container]
enabled = false
image = "python:3.12"
workdir = "/workspace"
