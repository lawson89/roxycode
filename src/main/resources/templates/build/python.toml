[commands]
install = "pip install -r requirements.txt"
clean = "find . -type d -name __pycache__ -exec rm -rf {} +"
compile = ""
build = ""
test_all = "pytest"
test_single = "pytest -k {testName}"
# Examples: "ruff check .", "flake8 .", "pylint src"
lint = ""
# Examples: "ruff check {file}", "flake8 {file}", "pylint {file}"
lint_single = ""
# Examples: "ruff format .", "black ."
format = ""
# Examples: "ruff format {file}", "black {file}"
format_single = ""

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^(E\s+|SyntaxError:|IndentationError:)'
test_failure_regex = '^FAILED '

[container]
enabled = false
image = "python:3.12"
workdir = "/workspace"
