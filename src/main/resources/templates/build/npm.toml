[build]
compile = "npm run build"
clean = "rm -rf dist/"

[test]
run_all = "npm test"
run_single = "npm test -- -t {testName}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '(^error\b|ERROR in|TS\d+:)'
test_failure_regex = '(^\s*✖|^\s*FAIL\s+)'

[container]
enabled = false
image = "node:22"
workdir = "/workspace"
