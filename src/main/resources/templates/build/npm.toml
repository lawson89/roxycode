timeout_seconds = 600

[commands]
install = "npm install"
clean = "rm -rf dist/"
compile = "npm run build"
build = "npm run build"
test_all = "npm test"
test_single = "npm test -- -t {testName}"
# Examples: 'npm run lint', 'npx eslint .', 'npx @biomejs/biome check .'
lint = ''
# Examples: 'npm run format', 'npx prettier --write .', 'npx @biomejs/biome format --write .'
format = ''

[env]
ROXY_CODE = "true"
# Optional: Set Node/toolchain environment variables if needed:
# NODE_OPTIONS = "--max-old-space-size=4096"

[parse]
error_regex = '(^error\b|ERROR in|TS\d+:)'
test_failure_regex = '(^\s*✖|^\s*FAIL\s+)'
context_lines = 5

[sandbox]
# Isolation mode: "none" | "native" (Linux bwrap / macOS sandbox-exec) | "docker"
mode = "none"
# Additional host paths mounted read-only in "native" mode (e.g., Node version managers; supports ~/ expansion)
readable_paths = ["~/.nvm", "~/.fnm", "~/.volta", "~/.asdf", "~/.mise"]
# Additional host paths mounted read-write in "native" mode (e.g., package caches; supports ~/ expansion)
writable_paths = ["~/.npm", "~/.cache", "~/.local/share/pnpm", "~/.yarn"]
# Docker settings (used when mode = "docker")
image = "node:22"
workdir = "/workspace"
