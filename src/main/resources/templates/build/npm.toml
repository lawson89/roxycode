[commands]
install = "npm install"
clean = "rm -rf dist/"
compile = "npm run build"
build = "npm run build"
test_all = "npm test"
test_single = "npm test -- -t {testName}"
lint = "npm run lint"
lint_single = "npx eslint {file}"
format = "npm run format"
format_single = "npx prettier --write {file}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '(^error\b|ERROR in|TS\d+:)'
test_failure_regex = '(^\s*✖|^\s*FAIL\s+)'

[container]
enabled = false
image = "node:22"
workdir = "/workspace"
