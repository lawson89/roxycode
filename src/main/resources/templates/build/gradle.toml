[commands]
install = "./gradlew dependencies"
clean = "./gradlew clean"
compile = "./gradlew classes testClasses"
build = "./gradlew assemble"
test_all = "./gradlew test"
test_single = "./gradlew test --tests {testName}"
lint = "./gradlew check -x test"
lint_single = "./gradlew check -x test"
format = "./gradlew spotlessApply"
format_single = "./gradlew spotlessApply -PspotlessIdeHook={file}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^> Compilation failed|e: file://.*:\d+:\d+'
test_failure_regex = '^[\w.]+ > [\w.]+ FAILED'

[container]
enabled = false
image = "eclipse-temurin:25-jdk"
workdir = "/workspace"
