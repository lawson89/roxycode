[build]
compile = "./gradlew classes"
clean = "./gradlew clean"

[test]
run_all = "./gradlew test"
run_single = "./gradlew test --tests {testName}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^> Compilation failed|e: file://.*:\d+:\d+'
test_failure_regex = '^[\w.]+ > [\w.]+ FAILED'

[container]
enabled = false
image = "eclipse-temurin:25-jdk"
workdir = "/workspace"
