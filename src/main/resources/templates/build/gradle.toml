[commands]
install = "./gradlew dependencies"
clean = "./gradlew clean"
compile = "./gradlew classes testClasses"
build = "./gradlew assemble"
test_all = "./gradlew test"
test_single = "./gradlew test --tests {testName}"
# Examples: "./gradlew check -x test", "./gradlew checkstyleMain pmdMain", "./gradlew detekt"
lint = ""
# Example: "./gradlew check -x test"
lint_single = ""
# Examples: "./gradlew spotlessApply", "./gradlew ktlintFormat"
format = ""
# Example: "./gradlew spotlessApply -PspotlessIdeHook={file}"
format_single = ""

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^> Compilation failed|e: file://.*:\d+:\d+'
test_failure_regex = '^[\w.]+ > [\w.]+ FAILED'

[container]
enabled = false
image = "eclipse-temurin:25-jdk"
workdir = "/workspace"
