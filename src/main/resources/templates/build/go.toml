[commands]
install = "go mod tidy"
clean = "go clean"
compile = "go build ./..."
build = "go build ./..."
test_all = "go test ./..."
test_single = "go test ./... -run {testName}"
lint = "go vet ./..."
lint_single = "go vet {file}"
format = "gofmt -w ."
format_single = "gofmt -w {file}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^.*:\d+:\d+: '
test_failure_regex = '^--- FAIL:'

[container]
enabled = false
image = "golang:1.23"
workdir = "/workspace"
