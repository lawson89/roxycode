[commands]
install = "go mod tidy"
clean = "go clean"
compile = "go build ./..."
build = "go build ./..."
test_all = "go test ./..."
test_single = "go test ./... -run {testName}"
lint = "go vet ./..."
format = "gofmt -w ."

[env]
ROXY_CODE = "true"

[parse]
error_regex = '^.*:\d+:\d+: '
test_failure_regex = '^--- FAIL:'
context_lines = 5

[sandbox]
# Isolation mode: "none" | "native" (Linux bwrap / macOS sandbox-exec) | "docker"
mode = "none"
# Additional host paths mounted read-write in "native" mode (supports ~/ expansion)
writable_paths = ["~/.cache/go-build", "~/go/pkg", "~/Library/Caches/go-build"]
# Docker settings (used when mode = "docker")
image = "golang:1.23"
workdir = "/workspace"
