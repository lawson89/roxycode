timeout_seconds = 600

[commands]
install = "cmake -B build"
clean = "rm -rf build/"
compile = "cmake -B build && cmake --build build"
build = "cmake -B build && cmake --build build"
test_all = "ctest --test-dir build --output-on-failure"
test_single = "ctest --test-dir build -R {testName} --output-on-failure"
# Examples: 'clang-tidy -p build', 'cppcheck --enable=all .'
lint = ''
# Example: "find src include -name '*.cpp' -o -name '*.h' | xargs clang-format -i"
format = ''

[env]
ROXY_CODE = "true"
# Optional: Set C/C++ compiler or CMake environment variables if needed:
# CC = "clang"
# CXX = "clang++"

[parse]
error_regex = '(^|:\d+:\d+:\s*)error:'
test_failure_regex = '^\s*\d+/\d+\s+Test\s+#\d+:.*Failed'
context_lines = 5

[sandbox]
# Isolation mode: "none" | "native" (Linux bwrap / macOS sandbox-exec) | "docker"
mode = "none"
# Additional host paths mounted read-only in "native" mode (e.g., custom toolchains / vcpkg; supports ~/ expansion)
readable_paths = ["~/.local", "~/vcpkg"]
# Additional host paths mounted read-write in "native" mode (e.g., ccache / conan caches; supports ~/ expansion)
writable_paths = ["~/.cache/ccache", "~/.ccache", "~/.conan2"]
# Docker settings (used when mode = "docker")
image = "gcc:14"
workdir = "/workspace"
