[build]
compile = "mkdir -p build && cd build && cmake .. && make"
clean = "rm -rf build/"

[test]
run_all = "cd build && ctest"
run_single = "cd build && ctest -R {testName}"

[env]
ROXY_CODE = "true"

[parse]
error_regex = '(^|:\d+:\d+:\s*)error:'
test_failure_regex = '^\s*\d+/\d+\s+Test\s+#\d+:.*Failed'

[container]
enabled = false
image = "gcc:14"
workdir = "/workspace"
