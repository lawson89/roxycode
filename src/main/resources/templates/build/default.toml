timeout_seconds = 600

[commands]
install = ''
clean = ''
compile = ''
build = ''
test_all = ''
test_single = ''
lint = ''
format = ''

[env]
ROXY_CODE = "true"
# Optional: Define environment variables passed to build commands:
# JAVA_HOME = "/path/to/jdk"

[parse]
error_regex = '^ERROR:'
test_failure_regex = '^FAIL:'
context_lines = 5

[sandbox]
# Isolation mode: "none" | "native" (Linux bwrap / macOS sandbox-exec) | "docker"
mode = "none"
# Additional host paths mounted read-only in "native" mode (supports ~/ expansion)
readable_paths = []
# Additional host paths mounted read-write in "native" mode (supports ~/ expansion)
writable_paths = []
# Docker settings (used when mode = "docker")
image = "ubuntu:24.04"
workdir = "/workspace"
